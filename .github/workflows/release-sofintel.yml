name: Release Sofintel

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "1.0.3"
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Validate manifests, formatting, and build scripts
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e 'workflow = YAML.load_file(".github/workflows/release-sofintel.yml"); jobs = workflow.fetch("jobs"); %w[validate macos linux windows publish].each { |job| abort("missing #{job} job") unless jobs.key?(job) }; %w[macos linux windows].each { |job| abort("#{job} must depend on validate") unless jobs.fetch(job).fetch("needs") == "validate" }'
          bash -n scripts/build-macos-arm64.sh scripts/build-macos-x86_64.sh scripts/build-linux-amd64.sh scripts/build-linux-arm64.sh scripts/verify-release.sh
          git diff --check
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo check --locked --package browser

  macos:
    name: macOS ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-15
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-${{ matrix.target }}
      - name: Fetch CEF framework
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          # cef-dll-sys downloads CEF at build time with no retry, which stalls on
          # shared runner networks. Pre-fetch it here with retry via the upstream
          # export-cef-dir tool, then point the build at it via CEF_PATH so the
          # build uses the local copy instead of doing a fragile single transfer.
          cef_rs=$(find "$cargo_home/git/checkouts" -maxdepth 2 -type d -name 'cef-rs-*' -print -quit)
          test -n "$cef_rs"
          # The checkout root has no Cargo.toml; the workspace lives in a
          # commit-sha subdirectory. Resolve it by locating export-cef-dir.
          cef_ws=$(dirname "$(find "$cef_rs" -type d -name 'export-cef-dir' -print -quit)")
          test -n "$cef_ws"
          # The cef-rs workspace version is e.g. 145.6.1+145.0.28; the cef-builds
          # index keys versions by the part after '+'. Resolve it from the crate
          # source so it never drifts from the pinned cef dependency.
          cef_version="$(awk -F'"' '/^version = /{print $2; exit}' "$cef_ws/Cargo.toml")"
          cef_lookup="${cef_version#*+}"
          test -n "$cef_lookup"
          export CEF_PATH="$HOME/cef-$$"
          # export-cef-dir is a cef-rs workspace member; it downloads the CEF
          # minimal archive with retries instead of the fragile single transfer
          # that cef-dll-sys would attempt during the build.
          (cd "$cef_ws" && cargo run -p export-cef-dir -- --target ${{ matrix.target }} --version "$cef_lookup" --force "$CEF_PATH")
          echo "CEF_PATH=$CEF_PATH" >> "$GITHUB_ENV"
      - name: Apply Intel GPUI compatibility patch
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          renderer=$(find "$cargo_home/git/checkouts" -path '*/crates/gpui_metal/src/renderer.rs' -print -quit)
          test -n "$renderer"
          perl -0pi -e 's/const YES: objc::runtime::BOOL = true;/const YES: objc::runtime::BOOL = true as objc::runtime::BOOL;/; s/const NO: objc::runtime::BOOL = false;/const NO: objc::runtime::BOOL = false as objc::runtime::BOOL;/' "$renderer"
          grep -F 'true as objc::runtime::BOOL' "$renderer"
      - name: Build Sofintel
        run: |
          cargo build --release --features mimalloc --package zed --package cli --target ${{ matrix.target }}
          cargo build --release --package browser --bin sofintel_helper --target ${{ matrix.target }}
      - name: Package app
        shell: bash
        run: |
          set -euo pipefail
          root="target/${{ matrix.target }}/release"
          app="$root/Sofintel.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$app/Contents/Frameworks"
          cp "$root/zed" "$app/Contents/MacOS/Sofintel"
          cp crates/zed/resources/Sofintel.icns "$app/Contents/Resources/Sofintel.icns"
          framework=$(find "$root/build" -path "*/cef_macos_${{ matrix.arch }}/Chromium Embedded Framework.framework" -type d -print -quit)
          test -n "$framework"
          ditto "$framework" "$app/Contents/Frameworks/Chromium Embedded Framework.framework"
          helpers=("Helper" "Helper (GPU)" "Helper (Renderer)" "Helper (Plugin)" "Helper (Alerts)")
          for helper_suffix in "${helpers[@]}"; do
            helper_name="Sofintel $helper_suffix"
            helper_app="$app/Contents/Frameworks/$helper_name.app"
            if [[ "$helper_suffix" == "Helper" ]]; then
              helper_identifier="dev.sofintel.Sofintel.helper"
            else
              helper_type="${helper_suffix#Helper (}"
              helper_type="${helper_type%)}"
              helper_identifier="dev.sofintel.Sofintel.helper.$helper_type"
            fi
            mkdir -p "$helper_app/Contents/MacOS"
            cp "$root/sofintel_helper" "$helper_app/Contents/MacOS/$helper_name"
            cat > "$helper_app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>$helper_name</string>
          <key>CFBundleDisplayName</key><string>$helper_name</string>
          <key>CFBundleExecutable</key><string>$helper_name</string>
          <key>CFBundleIdentifier</key><string>$helper_identifier</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSUIElement</key><true/>
          </dict></plist>
          PLIST
            printf 'APPL????' > "$helper_app/Contents/PkgInfo"
          done
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>Sofintel</string>
          <key>CFBundleDisplayName</key><string>Sofintel</string>
          <key>CFBundleExecutable</key><string>Sofintel</string>
          <key>CFBundleIdentifier</key><string>dev.sofintel.Sofintel</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleIconFile</key><string>Sofintel.icns</string>
          <key>CFBundleShortVersionString</key><string>${RELEASE_VERSION#v}</string>
          <key>CFBundleVersion</key><string>${RELEASE_VERSION#v}</string>
          <key>LSMinimumSystemVersion</key><string>10.15.7</string>
          <key>CFBundleURLTypes</key><array><dict><key>CFBundleURLSchemes</key><array><string>sofintel</string></array></dict></array>
          </dict></plist>
          PLIST
          codesign --force --sign - "$app/Contents/Frameworks/Chromium Embedded Framework.framework"
          for helper_suffix in "${helpers[@]}"; do
            codesign --force --sign - "$app/Contents/Frameworks/Sofintel $helper_suffix.app"
          done
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "Sofintel-${RELEASE_VERSION#v}-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Sofintel-${{ env.RELEASE_VERSION }}-macos-${{ matrix.arch }}
          path: Sofintel-*-macos-${{ matrix.arch }}.zip

  linux:
    name: Linux ${{ matrix.arch }} DEB
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld dpkg-dev pkg-config libglib2.0-dev libgtk-3-dev libgdk-pixbuf-2.0-dev libpango1.0-dev libatk1.0-dev libcairo2-dev libx11-dev libwayland-dev libxkbcommon-dev libudev-dev libfontconfig1-dev libasound2-dev libdbus-1-dev libxkbcommon-x11-dev libegl1-mesa-dev libx11-xcb-dev
      - name: Verify native linker dependencies
        shell: bash
        run: |
          set -euo pipefail
          pkg-config --exists x11 x11-xcb xcb
          library=$(ldconfig -p | awk '/libX11-xcb\.so/{print $NF; exit}')
          test -n "$library" && test -e "$library"
      - name: Build Sofintel
        run: cargo build --locked --release --features mimalloc --package zed --package cli
      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          package="sofintel_${version}_${{ matrix.arch }}"
          mkdir -p "$package/DEBIAN" "$package/usr/bin" "$package/usr/share/applications" "$package/usr/share/doc/sofintel" "$package/usr/share/icons/hicolor/512x512/apps"
          install -m 0755 target/release/zed "$package/usr/bin/sofintel"
          install -m 0755 target/release/cli "$package/usr/bin/sofintel-cli"
          cat > "$package/DEBIAN/control" <<CONTROL
          Package: sofintel
          Version: $version
          Section: editors
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: Sofintel contributors
          Description: Sofintel browser, code editor, and terminal
           Sofintel is a fast development environment for focused work.
          CONTROL
          cat > "$package/usr/share/applications/sofintel.desktop" <<DESKTOP
          [Desktop Entry]
          Name=Sofintel
          Comment=Browser, code editor, and terminal
          Exec=sofintel %U
          Terminal=false
          Type=Application
          Categories=Development;TextEditor;
          Icon=sofintel
          MimeType=text/plain;inode/directory;
          DESKTOP
          cp LICENSE-GPL "$package/usr/share/doc/sofintel/copyright"
          install -m 0644 icon.png "$package/usr/share/icons/hicolor/512x512/apps/sofintel.png"
          dpkg-deb --build --root-owner-group "$package" "Sofintel-${version}-linux-${{ matrix.arch }}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: Sofintel-${{ env.RELEASE_VERSION }}-linux-${{ matrix.arch }}
          path: Sofintel-*.deb

  windows:
    name: Windows x64
    needs: validate
    runs-on: windows-2022
    env:
      CARGO_HOME: 'D:\cargo'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Locate DirectX shader compiler
        shell: pwsh
        run: |
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $fxc = Get-ChildItem -Path $sdkBin -Filter fxc.exe -Recurse | Where-Object { $_.FullName -like '*\x64\fxc.exe' } | Sort-Object FullName | Select-Object -Last 1
          if (-not $fxc) { throw "Windows SDK fxc.exe was not found" }
          "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-debug-x86_64
      - name: Build Sofintel
        # GPUI's pinned Windows shader compiler is unavailable on hosted runners.
        # Debug assertions skip shader compilation while still producing a usable binary.
        run: cargo build --features mimalloc --package zed --package cli
      - name: Package Sofintel
        shell: pwsh
        run: |
          $version = "${env:RELEASE_VERSION}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item target/debug/zed.exe package/Sofintel.exe
          Copy-Item target/debug/cli.exe package/sofintel-cli.exe
          Copy-Item LICENSE-GPL package/LICENSE-GPL
          Copy-Item icon.png package/Sofintel.png
          Compress-Archive -Path package/* -DestinationPath "Sofintel-$version-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Sofintel-${{ env.RELEASE_VERSION }}-windows-x86_64
          path: Sofintel-*.zip

  publish:
    name: Publish GitHub release
    needs: [validate, macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Sofintel-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_VERSION#v}"
          tag="v$version"
          gh release create "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" --title "Sofintel $version" --generate-notes
